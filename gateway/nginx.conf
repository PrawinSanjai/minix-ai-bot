limit_req_zone $binary_remote_addr zone=minix_api:10m rate=120r/m;

log_format minix '$remote_addr [$time_local] "$request" $status request_id=$request_id';
access_log /var/log/nginx/access.log minix;

server {
    listen 80;
    client_max_body_size 25k;

    location / {
        limit_req zone=minix_api burst=30 nodelay;
        limit_req_status 429;

        proxy_pass http://host.docker.internal:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_buffering off;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }
}
